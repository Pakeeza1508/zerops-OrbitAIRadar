name: Phase 2 isolated E2E tests

on:
  push:
    branches: [phase-2-auth-profile-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Seven Phase 2 acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: orbit_phase2_ci
      JWT_SECRET: github-actions-phase2-dummy-secret-isolated-only-never-production
      CORS_ORIGINS: http://127.0.0.1:3000
      GROQ_API_KEY: ""
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000
      CI: "false"
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install FastAPI dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Start test-only FastAPI server
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > ../backend-ci.log 2>&1 &
          echo $! > ../backend-ci.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              echo "Backend ready and MongoDB reachable"
              exit 0
            fi
            sleep 2
          done
          cat ../backend-ci.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install React and Playwright browser tooling
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save --legacy-peer-deps playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Build existing React application
        working-directory: frontend
        run: npm run build

      - name: Start static React test site
        working-directory: frontend
        run: |
          npx --yes serve@14 -s build -l 3000 > ../frontend-ci.log 2>&1 &
          echo $! > ../frontend-ci.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              echo "React test site ready"
              exit 0
            fi
            sleep 2
          done
          cat ../frontend-ci.log
          exit 1

      - name: Execute seven isolated E2E acceptance tests
        working-directory: frontend
        run: node e2e/phase2.cjs

      - name: Upload test results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-e2e-results
          path: |
            frontend/test-results/phase2-results.json
            backend-ci.log
            frontend-ci.log
          if-no-files-found: ignore
